# Reusable Node CI — pin from product repos: @v1.0.0
name: Reusable Node CI

on:
  workflow_call:
    inputs:
      node-version:
        required: false
        type: string
        default: '22'
      flavor:
        required: true
        type: string
        description: 'nest (Prisma + build) or next (tsc + build)'
      working-directory:
        required: false
        type: string
        default: '.'

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    env:
      DATABASE_URL: mysql://ci:ci@127.0.0.1:3306/ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
      - run: npm ci
      - if: inputs.flavor == 'nest'
        run: npx prisma generate
      - if: inputs.flavor == 'nest'
        run: npx prisma validate
      - if: inputs.flavor == 'next'
        run: npx tsc --noEmit
      - run: npm run build